/* ---------- 7. Match logging + peer confirmation ---------- */

/** Run a change, then celebrate any badge unlocks or half-point rating milestones it caused. */
function withCelebration(change, fallbackToast) {
  recomputeIfNeeded();
  const beforeR = Object.fromEntries(state.players.map(p => [p.id, [p.ratingDoubles, p.ratingSingles]]));
  const beforeB = computeBadges().earned;
  change();
  recompute(); dirty = false;
  save();
  const news = [];
  const afterB = computeBadges().earned;
  for (const p of state.players) {
    for (const b of BADGES) if (afterB[p.id][b.id] && !beforeB[p.id]?.[b.id]) news.push(`${b.ico} ${p.name} unlocked ${b.name}!`);
    [['ratingDoubles', 'doubles'], ['ratingSingles', 'singles']].forEach(([k, label], i) => {
      const was = beforeR[p.id]?.[i];
      if (was !== undefined && Math.floor(p[k] * 2 + 1e-9) > Math.floor(was * 2 + 1e-9)) news.push(`🚀 ${p.name} crossed ${(Math.floor(p[k] * 2 + 1e-9) / 2).toFixed(3)} in ${label}!`);
    });
  }
  render();
  if (news.length) { confetti(); toast(news.length > 1 ? `${news[0]} (+${news.length - 1} more)` : news[0], 4000); }
  else if (fallbackToast) toast(fallbackToast);
}

async function submitMatch() {
  const n = form.type === 'singles' ? 1 : 2;
  const t1 = form.t1.slice(0, n), t2 = form.t2.slice(0, n), all = [...t1, ...t2];
  if (!state.activeUserId) return toast('Add a player first');
  if (all.some(x => !x)) return toast('Pick every player before saving');
  if (new Set(all).size !== all.length) return toast('A player cannot appear twice in one match');
  const r = validateScores();
  if (!r.ok) return toast(r.msg || 'Check the scores');
  const date = new Date(form.date);
  if (isNaN(date)) return toast('Pick a valid date and time');
  // Duplicate guard: same teams and same score within 12 hours, or any entry for these teams in the last 20 minutes.
  const mine = r.games.map(g => `${g.s1}–${g.s2}`).join(', ');
  const near = sameLineup(t1, t2, form.type).map(x => ({ ...x, gap: Math.abs(new Date(x.m.date) - date) }));
  const exact = near.find(x => x.score === mine && x.gap < 12 * 36e5);
  const clash = !exact && near.find(x => x.gap < 20 * 6e4);
  const hit = exact || clash;
  if (hit) {
    const m = hit.m, when = fmtDateTime(m.date), who = esc(pname(m.loggedBy));
    const pick = await openModal(`<h2>${exact ? 'This match looks already logged' : 'These teams were just logged'}</h2>
      <p>${exact ? `${who} already entered <b class="num">${esc(hit.score)}</b> for these same teams (${esc(when)}, ${statusWord(m)}). Saving again would count the game twice.`
        : `${who} entered <b class="num">${esc(hit.score)}</b> for these same teams at ${esc(when)} (${statusWord(m)}), and you are entering <b class="num">${esc(mine)}</b>. If it is the same game, confirm or dispute that entry instead of adding a second one.`}</p>
      <div class="acts"><button class="btn" data-modal="alt">It's a different game — save</button>
        ${canAct(m) ? '<button class="btn" data-modal="cancel">Don\'t save</button><button class="btn primary" data-modal="ok">Confirm the existing one</button>' : '<button class="btn primary" data-modal="cancel">Don\'t save</button>'}</div>`);
    if (pick === 'ok') { freshForm(true); return confirmMatch(m.id); }
    if (pick !== 'alt') return;
  }
  const venue = form.venue.trim();
  const comm = state.meta.commissioner;
  const match = {
    id: uid('m'), date: date.toISOString(), venue, type: form.type, team1: t1, team2: t2, format: form.format, games: r.games,
    winnerTeam: r.winner, status: comm ? 'confirmed' : 'pending', loggedBy: state.activeUserId, confirmedBy: [state.activeUserId], disputedBy: [], ratingDeltas: {}
  };
  withCelebration(() => {
    state.matches.push(match);
    if (venue && !state.venues.some(x => x.toLowerCase() === venue.toLowerCase())) state.venues.push(venue);
    freshForm(true);       // keep the same four players for the next game
  }, comm ? 'Match saved — ratings updated' : 'Match saved — waiting for an opponent to confirm');
}

function confirmMatch(id) {
  const m = M(id), u = state.activeUserId;
  if (!m || !canAct(m)) return;
  withCelebration(() => {
    if (!m.confirmedBy.includes(u)) m.confirmedBy.push(u);
    m.disputedBy = m.disputedBy.filter(x => x !== u);
    const loggerTeam = teamOf(m, m.loggedBy), myTeam = teamOf(m, u);
    // An opponent of the logger must verify. If the logger did not play, any participant counts.
    const verifies = myTeam !== 0 && (loggerTeam === 0 || myTeam !== loggerTeam);
    if (state.meta.commissioner) { m.disputedBy = []; m.status = 'confirmed'; }
    else if (verifies && !m.disputedBy.length) m.status = 'confirmed';
  });
  if (m.status !== 'confirmed') toast(m.disputedBy.length ? 'Recorded — the dispute still needs resolving' : 'Recorded — an opponent still needs to confirm');
  else if (!$('#toast').classList.contains('show')) toast('Score confirmed — ratings updated');
}

async function disputeMatch(id) {
  const m = M(id), u = state.activeUserId;
  if (!m || !canAct(m)) return;
  const ok = await confirmDialog({ title: 'Dispute this score?', body: `${scoreStr(m)} — the match stays unrated until the dispute is settled. The organiser can delete it so it can be entered again.`, ok: 'Dispute', danger: true });
  if (!ok) return;
  if (!m.disputedBy.includes(u)) m.disputedBy.push(u);
  m.confirmedBy = m.confirmedBy.filter(x => x !== u || x === m.loggedBy);
  save(); render(); toast('Match marked as disputed');
}

async function deleteMatch(id) {
  const m = M(id);
  if (!m || !canDelete(m)) return;
  const ok = await confirmDialog({ title: 'Delete this match?', body: `${m.team1.map(pname).join(' & ')} vs ${m.team2.map(pname).join(' & ')}, ${scoreStr(m)}. Ratings will be recalculated without it.`, ok: 'Delete', danger: true });
  if (!ok) return;
  state.matches = state.matches.filter(x => x.id !== id);
  dirty = true; save(); render(); toast('Match deleted');
}

/** Add or edit a player. Resolves with the player (or null if cancelled). */
function playerDialog({ id = null, guest = false, name = '' } = {}) {
  const p = id ? P(id) : null;
  const hasMatches = p && state.matches.some(m => teamOf(m, p.id));
  modalValidate = () => {
    const nm = $('#pName').value.trim();
    if (!nm) { toast('Enter a name'); return false; }
    if (state.players.some(x => x.id !== id && x.name.toLowerCase() === nm.toLowerCase())) { toast('That name is already taken'); return false; }
    return true;
  };
  return openModal(`<h2>${p ? 'Edit player' : guest ? 'Add guest player' : 'Add player'}</h2>
    <label class="fld">Name<input type="text" id="pName" value="${esc(p?.name ?? name)}" maxlength="40" autocomplete="off"></label>
    <label class="fld">Phone (optional)<input type="tel" id="pPhone" value="${esc(p?.phone ?? '')}" maxlength="20" autocomplete="off"></label>
    <label class="fld">Starting rating
      <select id="pInit" ${hasMatches ? 'disabled' : ''}>${[3, 3.5].concat(p && ![3, 3.5].includes(p.initialRating) ? [p.initialRating] : []).map(r => `<option value="${r}"${(p?.initialRating ?? 3) === r ? ' selected' : ''}>${fmtR(r)}${r === 3 ? ' — default provisional' : r === 3.5 ? ' — experienced' : ''}</option>`).join('')}</select></label>
    ${hasMatches ? '<p class="small muted">Starting rating is locked once a player has matches.</p>' : ''}
    <label class="check"><input type="checkbox" id="pGuest" ${(p ? p.isGuest : guest) ? 'checked' : ''}>Guest player (occasional visitor)</label>
    <div class="acts">${p && !hasMatches && isAdmin() ? '<button class="btn danger" data-modal="alt" style="margin-right:auto">Remove</button>' : ''}
      <button class="btn" data-modal="cancel">Cancel</button><button class="btn primary" data-modal="ok">Save</button></div>`, '#pName')
  .then(res => {
    if (res === 'alt' && p) {
      state.players = state.players.filter(x => x.id !== p.id);
      if (state.activeUserId === p.id) state.activeUserId = state.players[0]?.id ?? null;
      if (viewPid === p.id) viewPid = null;
      form = null; dirty = true; save(); render(); toast('Player removed');
      return null;
    }
    if (res !== 'ok') return null;
    const vals = { name: $('#pName').value.trim(), phone: $('#pPhone').value.trim(), isGuest: $('#pGuest').checked, initialRating: +$('#pInit').value };
    let out = p;
    if (p) Object.assign(p, vals);
    else {
      out = { id: uid('p'), ...vals, avatarColor: AVATAR_COLORS[state.players.length % AVATAR_COLORS.length],
        ratingDoubles: vals.initialRating, ratingSingles: vals.initialRating, historyDoubles: [], historySingles: [], createdDate: new Date().toISOString() };
      state.players.push(out);
      if (!state.activeUserId) state.activeUserId = out.id;
    }
    dirty = true; save();
    toast(p ? 'Player updated' : `${out.name} added`);
    return out;
  });
}

/* ---------- 8. Data portability + Google Sheets sync ---------- */

/** State as shared outside this browser: no sync URL or passcode. */
function exportable() {
  const copy = JSON.parse(JSON.stringify(state));
  delete copy.meta.syncUrl; delete copy.meta.syncSecret; delete copy.meta.adminSecret; delete copy.meta.isAdmin; delete copy.meta.remoteUpdatedAt; delete copy.meta.lastSync;
  return copy;
}
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportJson() {
  state.meta.lastBackup = new Date().toISOString(); persist();
  download(`pickletrack_backup_${todayStamp()}.json`, JSON.stringify(exportable(), null, 2), 'application/json');
  render(); toast('Backup downloaded');
}
function exportCsv() {
  // Leading = + - @ would run as a formula in Excel/Sheets, so those cells get a quote prefix.
  const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return `"${s.replace(/"/g, '""')}"`; };
  const names = ids => ids.map(pname).join(' & ');
  const head = ['Match ID', 'Date', 'Venue', 'Type', 'Format', 'Team 1', 'Team 2', 'Scores (T1-T2)', 'Team 1 Points', 'Team 2 Points', 'Winner', 'Status', 'Logged By', 'Confirmed By', 'Disputed By', 'Rating Changes'];
  const rows = sortedMatches(true).map(m => [m.id, new Date(m.date).toLocaleString(), m.venue, m.type, FORMATS[m.format].label, names(m.team1), names(m.team2),
    m.games.map(g => `${g.s1}-${g.s2}`).join(' | '), pointsFor(m, 1), pointsFor(m, 2), names(m['team' + m.winnerTeam]),
    m.status === 'confirmed' ? 'Confirmed' : m.disputedBy.length ? 'Disputed' : 'Pending Verification', pname(m.loggedBy), names(m.confirmedBy), names(m.disputedBy),
    Object.entries(m.ratingDeltas).map(([id, d]) => `${pname(id)} ${d >= 0 ? 'up' : 'down'} ${Math.abs(d).toFixed(3)}`).join('; ')]);
  download(`pickletrack_matches_${todayStamp()}.csv`, '﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Match history exported');
}

/** Replace all data with an imported/restored state, keeping this device's sync settings and theme. */
function replaceState(data) {
  const keep = (({ syncUrl, syncSecret, adminSecret, isAdmin, autoSync, theme, remoteUpdatedAt, lastSync, commissioner }) => ({ syncUrl, syncSecret, adminSecret: adminSecret || '', isAdmin: !!isAdmin, autoSync, theme, remoteUpdatedAt, lastSync, commissioner, demoCleared: true }))(state.meta);
  const prevUser = state.activeUserId;
  const next = normalize(JSON.parse(JSON.stringify(data)));
  Object.assign(next.meta, keep);
  if (next.players.some(p => p.id === prevUser)) next.activeUserId = prevUser;
  state = next; form = null; viewPid = null; openSlot = null; dirty = true;
  recomputeIfNeeded();
}
function importJsonFile(file) {
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read that file');
  reader.onload = async () => {
    let data;
    try { data = JSON.parse(reader.result); } catch { return toast('That file is not valid JSON'); }
    if (!data || !Array.isArray(data.players) || !Array.isArray(data.matches)) return toast('That file is not a PickleTrack backup');
    const ok = await confirmDialog({ title: 'Replace all current data?',
      body: `The backup holds ${data.players.length} players and ${data.matches.length} matches. It will replace the ${state.players.length} players and ${state.matches.length} matches on this device. This cannot be undone — export a backup first if unsure.`, ok: 'Replace data', danger: true });
    if (!ok) return;
    replaceState(data); save(); render(); toast('Backup imported');
  };
  reader.readAsText(file);
}

/* --- Google Apps Script sync ---
   POST with a plain-text body is a "simple" request, so the browser sends no CORS preflight
   (Apps Script web apps cannot answer one). The passcode travels in the body, not the URL. */
let syncTimer = null, syncBusy = false, syncNote = '';
function syncStatusText() {
  if (syncNote) return syncNote;
  if (!state.meta.syncUrl) return 'Sync is off — add a Web App URL to turn it on.';
  return state.meta.lastSync ? `Last synced ${fmtDateTime(state.meta.lastSync)}.` : 'Not synced yet.';
}
function setSyncNote(t) { syncNote = t; const el = $('#syncStatus'); if (el) el.textContent = syncStatusText(); }
async function syncCall(action, extra = {}) {
  const url = state.meta.syncUrl.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) throw new Error('The Web App URL should start with https://script.google.com/');
  const res = await fetch(url, { method: 'POST', body: JSON.stringify({ secret: state.meta.syncSecret, admin: state.meta.adminSecret || '', action, ...extra }), redirect: 'follow' });
  if (!res.ok) throw new Error('Server answered ' + res.status);
  const text = await res.text();
  try { return JSON.parse(text); } catch { throw new Error('Unexpected reply — check the deployment gives access to "Anyone"'); }
}
/** True when this device has nothing the sheet has not already seen. */
const isClean = () => (!state.players.length && !state.matches.length) || state.meta.updatedAt === state.meta.remoteUpdatedAt;
/** Swap in the sheet's copy, keeping a half-filled Log Match form when its players still exist. */
function applyRemote(r) {
  const f = form;
  replaceState(r.state);
  if (f && [...f.t1, ...f.t2].every(x => !x || P(x))) form = f;
  state.meta.updatedAt = r.updatedAt || state.meta.updatedAt;
  state.meta.remoteUpdatedAt = r.updatedAt || ''; state.meta.lastSync = new Date().toISOString();
  persist(); render();
}
/** Runs when the app opens, regains focus, and once a minute: picks up matches logged on other devices. */
async function autoPull() {
  if (!state.meta.syncUrl || !state.meta.autoSync || syncBusy || modalResolve || document.hidden) return;
  if (document.activeElement?.matches?.('input,select')) return;      // never yank the screen mid-typing
  syncBusy = true;
  try {
    const r = await syncCall('pull');
    if (!r.ok) throw new Error(r.error || 'Sync failed');
    if (!r.state || !r.updatedAt || r.updatedAt === state.meta.remoteUpdatedAt) return;
    if (isClean()) { applyRemote(r); setSyncNote(''); toast('Updated with changes from other devices'); }
    else setSyncNote('The sheet was changed from another device. Use Sync Now to choose which copy to keep.');
  } catch (e) { setSyncNote('Sync failed: ' + e.message); }
  finally { syncBusy = false; }
}
/** Ask the sheet whether the organiser passcode typed on this device is the right one. */
async function verifyAdmin() {
  const m = state.meta;
  if (!m.syncUrl || !m.adminSecret) { m.isAdmin = false; persist(); render(); return; }
  try {
    const r = await syncCall('check');
    if (!r.ok) throw new Error(/unknown action/i.test(r.error || '') ? 'update the Apps Script to the new version first' : (r.error || 'check failed'));
    m.isAdmin = !!r.admin; persist(); render();
    toast(m.isAdmin ? 'Organiser access unlocked on this device' : 'That organiser passcode is not correct');
  } catch (e) { m.isAdmin = false; persist(); render(); toast('Could not check — ' + e.message, 4000); }
}
function scheduleSync() {
  clearTimeout(syncTimer);
  if (!state.meta.syncUrl || !state.meta.autoSync) return;
  syncTimer = setTimeout(() => pushSync({ quiet: true }), 2500);
}
async function pushSync({ force = false, quiet = false } = {}) {
  if (!state.meta.syncUrl) { if (!quiet) toast('Add your Web App URL first'); return; }
  if (syncBusy) { if (quiet) scheduleSync(); return; }
  syncBusy = true; setSyncNote('Syncing…');
  try {
    const sent = state.meta.updatedAt;
    const r = await syncCall('push', { state: exportable(), baseUpdatedAt: state.meta.remoteUpdatedAt || '', force });
    if (r.ok) {
      state.meta.remoteUpdatedAt = r.updatedAt || sent; state.meta.lastSync = new Date().toISOString(); persist();
      setSyncNote(''); if (!quiet) toast('Synced to Google Sheets');
    } else if (r.adminOnly) {
      // The sheet refused because this copy is missing or has altered something only the organiser may touch.
      setSyncNote(`The sheet refused this device's copy: ${r.error} Tap "Restore from Sheet" to get back in step.`);
      toast('Sync refused — ' + r.error, 4500);
    } else if (r.conflict) {
      setSyncNote('The sheet was changed from another device. Use Sync Now to choose which copy to keep.');
      if (quiet) toast('Sheet has newer data — open Data & Sync to resolve');
      else {
        syncBusy = false;
        const pick = await openModal(`<h2>The sheet has other changes</h2><p>The Google Sheet was updated${r.updatedAt ? ' on ' + esc(fmtDateTime(r.updatedAt)) : ''} from another device since this one last synced. Which copy should win?</p>
          <div class="acts"><button class="btn" data-modal="cancel">Cancel</button><button class="btn ${isAdmin() ? '' : 'primary'}" data-modal="alt">Use the sheet's data</button>${isAdmin() ? '<button class="btn danger" data-modal="ok">Overwrite the sheet</button>' : ''}</div>
          ${isAdmin() ? '' : '<p class="small muted">Only the organiser can overwrite the sheet. Anything you entered since your last sync will need entering again.</p>'}`);
        if (pick === 'ok') return pushSync({ force: true });
        if (pick === 'alt') return pullSync(true);
      }
    } else throw new Error(r.error || 'Sync failed');
  } catch (e) {
    setSyncNote('Sync failed: ' + e.message);
    if (!quiet) toast('Sync failed — ' + e.message, 4000);
  } finally { syncBusy = false; }
}
async function pullSync(skipConfirm = false) {
  if (!state.meta.syncUrl) return toast('Add your Web App URL first');
  if (syncBusy) return;
  syncBusy = true; setSyncNote('Fetching from sheet…');
  try {
    const r = await syncCall('pull');
    if (!r.ok) throw new Error(r.error || 'Restore failed');
    if (!r.state || !Array.isArray(r.state.players)) throw new Error('The sheet has no PickleTrack data yet');
    syncBusy = false; setSyncNote('');
    if (!skipConfirm && !(await confirmDialog({ title: 'Restore from sheet?', body: `The sheet holds ${r.state.players.length} players and ${(r.state.matches || []).length} matches${r.updatedAt ? ', saved ' + fmtDateTime(r.updatedAt) : ''}. They will replace everything on this device.`, ok: 'Restore', danger: true }))) return;
    applyRemote(r); toast('Restored from Google Sheets');
  } catch (e) {
    setSyncNote('Restore failed: ' + e.message); toast('Restore failed — ' + e.message, 4000);
  } finally { syncBusy = false; }
}

/* The Apps Script users paste into script.google.com. Kept free of backticks and
   dollar-brace sequences so it can live inside this template literal unchanged. */
const GAS_CODE = String.raw`/**
 * PickleTrack <-> Google Sheets sync
 * 1. Change SECRET (shared with players) and ADMIN_SECRET (keep to yourself) below.
 * 2. Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone.
 * 3. Paste the Web App URL and the same passcode into PickleTrack.
 * After editing this script, deploy a NEW VERSION for changes to take effect.
 */
const SECRET = 'change-me-to-your-passcode';             // everyone in the club
const ADMIN_SECRET = 'change-me-to-your-admin-passcode'; // organiser only: needed to delete or erase
const STATE_SHEET = '_PickleTrackState';   // raw backup, do not edit by hand
const CHUNK = 45000;                       // a cell holds at most 50,000 characters

function doGet() {
  return out({ ok: true, app: 'PickleTrack', hint: 'Sync uses POST requests from the app.' });
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    const req = JSON.parse(e.postData.contents);
    if (SECRET === 'change-me-to-your-passcode') return out({ ok: false, error: 'Set your own SECRET in the script first' });
    if (req.secret !== SECRET) return out({ ok: false, error: 'Wrong passcode' });
    const isAdmin = ADMIN_SECRET !== 'change-me-to-your-admin-passcode' && req.admin === ADMIN_SECRET;
    if (req.action === 'check') return out({ ok: true, admin: isAdmin });
    const ss = book();
    const current = readState(ss);
    if (req.action === 'pull') {
      return out({ ok: true, state: current.state, updatedAt: current.updatedAt });
    }
    if (req.action === 'push') {
      if (!req.state || !req.state.players || !req.state.matches) return out({ ok: false, error: 'No state in request' });
      // Someone else wrote since this device last synced: let the user decide.
      if (!req.force && current.updatedAt && current.updatedAt !== (req.baseUpdatedAt || '')) {
        return out({ ok: false, conflict: true, updatedAt: current.updatedAt });
      }
      // Members may add and confirm. Removing or rewriting what is already saved needs the admin passcode.
      if (!isAdmin && current.state) {
        const problem = protect(current.state, req.state);
        if (problem) return out({ ok: false, adminOnly: true, error: problem });
      }
      const stamp = (req.state.meta && req.state.meta.updatedAt) || new Date().toISOString();
      writeState(ss, req.state, stamp);
      writeReadable(ss, req.state);
      return out({ ok: true, updatedAt: stamp });
    }
    return out({ ok: false, error: 'Unknown action' });
  } catch (err) {
    return out({ ok: false, error: String(err && err.message || err) });
  } finally {
    lock.releaseLock();
  }
}

/** Returns a message when a non-admin copy drops or rewrites saved data, otherwise ''. */
function protect(saved, incoming) {
  const players = {}, matches = {};
  incoming.players.forEach(function (p) { players[p.id] = true; });
  incoming.matches.forEach(function (m) { matches[m.id] = m; });
  const sig = function (m) {
    return [m.type, m.format, (m.team1 || []).join('+'), (m.team2 || []).join('+'),
      (m.games || []).map(function (g) { return g.s1 + '-' + g.s2; }).join(','), m.winnerTeam].join('|');
  };
  for (let i = 0; i < saved.players.length; i++) {
    if (!players[saved.players[i].id]) return 'Only the organiser can remove players.';
  }
  for (let j = 0; j < saved.matches.length; j++) {
    const before = saved.matches[j], after = matches[before.id];
    if (!after) return 'Only the organiser can delete matches.';
    if (sig(after) !== sig(before)) return 'Only the organiser can change a saved score or line-up.';
    if (before.status === 'confirmed' && after.status !== 'confirmed') return 'Only the organiser can un-confirm a match.';
  }
  return '';
}

function out(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);
}

/** The bound spreadsheet, or one created on first use for standalone scripts. */
function book() {
  let ss = SpreadsheetApp.getActiveSpreadsheet();
  if (ss) return ss;
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('SHEET_ID');
  if (id) return SpreadsheetApp.openById(id);
  ss = SpreadsheetApp.create('PickleTrack Data');
  props.setProperty('SHEET_ID', ss.getId());
  return ss;
}

function sheet(ss, name) {
  return ss.getSheetByName(name) || ss.insertSheet(name);
}

function readState(ss) {
  const sh = ss.getSheetByName(STATE_SHEET);
  if (!sh || sh.getLastRow() < 2) return { state: null, updatedAt: '' };
  const values = sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(function (r) { return String(r[0]); });
  try {
    return { state: JSON.parse(values.slice(1).join('')), updatedAt: values[0] };
  } catch (err) {
    return { state: null, updatedAt: '' };
  }
}

function writeState(ss, state, stamp) {
  const sh = sheet(ss, STATE_SHEET);
  const json = JSON.stringify(state);
  const rows = [[stamp]];
  for (let i = 0; i < json.length; i += CHUNK) rows.push([json.substring(i, i + CHUNK)]);
  sh.clearContents();
  sh.getRange(1, 1, rows.length, 1).setNumberFormat('@').setValues(rows);
}

/** Text starting with = + - @ would be run as a formula, so it is stored as plain text. */
function safe(v) {
  const s = String(v == null ? '' : v);
  return /^[=+\-@]/.test(s) ? "'" + s : s;
}

/** Human-readable Players and Matches tabs, rewritten on every sync. */
function writeReadable(ss, state) {
  const names = {};
  state.players.forEach(function (p) { names[p.id] = p.name; });
  const team = function (ids) { return (ids || []).map(function (id) { return names[id] || '?'; }).join(' & '); };

  const players = [['Player', 'Guest', 'Doubles Rating', 'Singles Rating', 'Phone', 'Joined']];
  state.players.forEach(function (p) {
    players.push([safe(p.name), p.isGuest ? 'Yes' : 'No', Number(p.ratingDoubles).toFixed(3), Number(p.ratingSingles).toFixed(3), safe(p.phone), String(p.createdDate || '').slice(0, 10)]);
  });
  fill(sheet(ss, 'Players'), players);

  const matches = [['Date', 'Venue', 'Type', 'Format', 'Team 1', 'Team 2', 'Scores', 'Winner', 'Status', 'Logged By']];
  state.matches.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).forEach(function (m) {
    matches.push([String(m.date).replace('T', ' ').slice(0, 16), safe(m.venue), m.type, m.format, safe(team(m.team1)), safe(team(m.team2)),
      m.games.map(function (g) { return g.s1 + ' to ' + g.s2; }).join(' | '), safe(team(m.winnerTeam === 1 ? m.team1 : m.team2)),
      m.status === 'confirmed' ? 'Confirmed' : (m.disputedBy && m.disputedBy.length ? 'Disputed' : 'Pending'), safe(names[m.loggedBy] || '')]);
  });
  fill(sheet(ss, 'Matches'), matches);
}

function fill(sh, rows) {
  sh.clearContents();
  sh.getRange(1, 1, rows.length, rows[0].length).setNumberFormat('@').setValues(rows);
  sh.getRange(1, 1, 1, rows[0].length).setFontWeight('bold');
  sh.setFrozenRows(1);
}
`;

/* ---------- 9. Modal / toast / confetti / theme ---------- */
let modalResolve = null, modalValidate = null;
function openModal(html, focusSel) {
  $('#modalCard').innerHTML = html;
  $('#modal').classList.add('open');
  ($(focusSel || '[data-modal="cancel"]', $('#modalCard')) || $('#modalCard button'))?.focus();
  return new Promise(res => { modalResolve = res; });
}
function closeModal(value) {
  if (value === 'ok' && modalValidate && !modalValidate()) return;
  const res = modalResolve;
  // Resolve before clearing the card so callers can still read form fields.
  modalResolve = null; modalValidate = null;
  if (res) res(value);
  Promise.resolve().then(() => { if (!modalResolve) { $('#modal').classList.remove('open'); $('#modalCard').innerHTML = ''; } });
}
function confirmDialog({ title, body, ok = 'OK', danger = false }) {
  return openModal(`<h2>${esc(title)}</h2><p>${esc(body)}</p>
    <div class="acts"><button class="btn" data-modal="cancel">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-modal="ok">${esc(ok)}</button></div>`)
    .then(v => v === 'ok');
}

let toastTimer = null;
function toast(msg, ms = 2500) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#16a34a', '#2563eb', '#eab308', '#e11d48', '#ffffff', '#22c55e'];
  const parts = Array.from({ length: 150 }, () => ({
    x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 4, vy: 2.5 + Math.random() * 4,
    s: 5 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    if (t - start > 3200) return;
    ctx.globalAlpha = Math.min(1, (3200 - (t - start)) / 600);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vy += 0.03;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.66); ctx.restore();
    }
    requestAnimationFrame(frame);
  })(start);
}

const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = state.meta.theme, dark = t === 'dark' || (t === 'auto' && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name="theme-color"]').content = dark ? '#0f172a' : '#16a34a';
}

/* ---------- 10. Event wiring & boot ---------- */
let installEvent = null;   // Chrome's deferred "install app" prompt
const actions = {
  install: async () => { if (!installEvent) return; installEvent.prompt(); await installEvent.userChoice; installEvent = null; render(); },
  tab: el => { tab = el.dataset.tab; openSlot = null; history.replaceState(null, '', '#' + tab); render(); scrollTo(0, 0); if (tab === 'log') autoPull(); },
  theme: () => { state.meta.theme = { auto: 'dark', dark: 'light', light: 'auto' }[state.meta.theme]; persist(); applyTheme(); renderChrome(); toast(`Theme: ${state.meta.theme}`); },
  'lb-filter': el => { lbMode = el.dataset.f; render(); },
  'lb-reg': () => { lbRegulars = !lbRegulars; render(); },
  'view-player': el => { viewPid = el.dataset.id; tab = 'profile'; history.replaceState(null, '', '#profile'); render(); scrollTo(0, 0); },
  'add-player': async () => { const p = await playerDialog(); if (p) { viewPid = p.id; render(); } },
  'edit-player': async el => { await playerDialog({ id: el.dataset.id }); render(); },
  'form-type': el => { form.type = el.dataset.v; openSlot = null; render(); },
  'slot-open': el => { openSlot = openSlot === el.dataset.slot ? null : el.dataset.slot; render(); },
  pick: el => { const [t, i] = openSlot.split('-').map(Number); form['t' + t][i] = el.dataset.id; openSlot = null; render(); },
  'add-guest': async () => {
    const slot = openSlot, name = $('#pickSearch')?.value.trim() || '';
    openSlot = null; render();
    const p = await playerDialog({ guest: true, name });
    if (p) { const [t, i] = slot.split('-').map(Number); form['t' + t][i] = p.id; }
    render();
  },
  step: el => {
    const g = form.games[+el.dataset.g], k = 's' + el.dataset.t;
    g[k] = String(clamp((parseInt(g[k]) || 0) + +el.dataset.d, 0, 99));
    $(`input[data-score][data-g="${el.dataset.g}"][data-t="${el.dataset.t}"]`).value = g[k];
    updateScoreStatus();
  },
  'log-submit': submitMatch,
  'form-reset': () => { form = null; openSlot = null; render(); },
  confirm: el => confirmMatch(el.dataset.id),
  dispute: el => disputeMatch(el.dataset.id),
  'del-match': el => deleteMatch(el.dataset.id),
  'export-json': exportJson,
  'export-csv': exportCsv,
  'import-json': () => (isAdmin() ? $('#importFile').click() : toast('Only the organiser can import a backup')),
  'sync-now': () => pushSync(),
  'sync-restore': () => pullSync(),
  'copy-script': async () => {
    try { await navigator.clipboard.writeText(GAS_CODE); toast('Script copied to clipboard'); }
    catch { toast('Copy blocked — open the code and copy it by hand'); }
  },
  'reset-all': async () => {
    if (!isAdmin()) return toast('Only the organiser can erase data');
    if (!(await confirmDialog({ title: 'Erase all data?', body: 'Every player, match and venue on this device will be removed. Sync settings are kept. This cannot be undone.', ok: 'Erase everything', danger: true }))) return;
    replaceState(emptyState()); save(); render(); toast('All data erased');
  }
};

document.addEventListener('click', e => {
  const md = e.target.closest('[data-modal]');
  if (md) return closeModal(md.dataset.modal);
  if (e.target.id === 'modal') return closeModal('cancel');
  // Close an open player picker when tapping elsewhere, without re-rendering the form.
  if (openSlot && !e.target.closest('.slot-wrap')) { openSlot = null; $('.pop')?.remove(); document.querySelectorAll('.slot').forEach(s => s.setAttribute('aria-expanded', 'false')); }
  const dot = e.target.closest('.dot');
  if (dot) return showTip(dot);
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](el);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-score]')) {
    const v = t.value === '' ? '' : String(clamp(parseInt(t.value) || 0, 0, 99));
    form.games[+t.dataset.g]['s' + t.dataset.t] = v;
    updateScoreStatus();
  } else if (t.id === 'pickSearch') $('#pickList').innerHTML = pickListHtml(t.value);
  else if (t.id === 'f-venue') form.venue = t.value;
  else if (t.id === 'f-date') { form.date = t.value; updateDupHint(); }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'activeUser') { state.activeUserId = t.value || null; viewPid = state.activeUserId; if (form && !form.t1[0] && !form.t2.includes(t.value) && !form.t1.includes(t.value)) form.t1[0] = t.value; persist(); render(); toast(`Now playing as ${pname(state.activeUserId)}`); }
  else if (t.id === 'f-format') { form.format = t.value; render(); }
  else if (t.matches('[data-cb]')) form.games[+t.dataset.g].cb = t.checked;
  else if (t.id === 'profileSel' || t.id === 'badgeSel') { viewPid = t.value; render(); }
  else if (t.id === 'commToggle') { state.meta.commissioner = t.checked; persist(); render(); toast(t.checked ? 'Commissioner mode on' : 'Commissioner mode off'); }
  else if (t.id === 'syncUrl') { state.meta.syncUrl = t.value.trim(); state.meta.remoteUpdatedAt = ''; state.meta.isAdmin = false; persist(); setSyncNote(''); verifyAdmin(); }
  else if (t.id === 'syncSecret') { state.meta.syncSecret = t.value; persist(); if (state.meta.adminSecret) verifyAdmin(); }
  else if (t.id === 'adminSecret') { state.meta.adminSecret = t.value; persist(); verifyAdmin(); }
  else if (t.id === 'autoSync') { state.meta.autoSync = t.checked; persist(); }
  else if (t.id === 'importFile') { if (t.files[0]) importJsonFile(t.files[0]); t.value = ''; }
});

/* Sparkline tooltips: hover, keyboard focus or tap. */
function showTip(dot) {
  const chart = dot.closest('.chart');
  chart.querySelector('.tip')?.remove();
  const tip = document.createElement('div');
  const x = +dot.dataset.x, y = +dot.dataset.y;
  tip.className = 'tip' + (x < 40 ? ' l' : x > 60 ? ' rt' : '') + (y < 35 ? ' below' : '');
  tip.textContent = dot.dataset.tip;
  tip.style.left = dot.style.left; tip.style.top = dot.style.top;
  chart.appendChild(tip);
}
document.addEventListener('pointerover', e => { const d = e.target.closest?.('.dot'); if (d) showTip(d); });
document.addEventListener('focusin', e => { if (e.target.matches?.('.dot')) showTip(e.target); });
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest?.('.dot')) e.target.closest('.chart').querySelector('.tip')?.remove(); });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (modalResolve) closeModal('cancel');
  else if (openSlot) { openSlot = null; render(); }
});
darkQuery.addEventListener('change', applyTheme);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['board', 'log', 'profile', 'badges', 'data'].includes(h) && h !== tab) { tab = h; render(); } });

/* Boot */
state = loadState();
viewPid = state.activeUserId;
if (['board', 'log', 'profile', 'badges', 'data'].includes(location.hash.slice(1))) tab = location.hash.slice(1);
applyTheme();
render();
persist();

/* App behaviour when hosted (GitHub Pages): offline cache, install prompt, cross-device refresh. */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvent = e; if (tab === 'data') render(); });
window.addEventListener('appinstalled', () => { installEvent = null; toast('PickleTrack installed'); if (tab === 'data') render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) autoPull(); });
setInterval(autoPull, 60000);
autoPull();
</script>
